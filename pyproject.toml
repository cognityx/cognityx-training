[project]
name = "cognityx-training"
version = "0.1.0"
description = "Training backends and dataset pipelines for Cognityx"
readme = "README.md"
authors = [
    { name = "Bhujay Kumar Bhatta", email = "bhujay.bhatta@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cognityx-core",
    "cognityx-observability",
    "cognityx-storage",
]

[project.optional-dependencies]
training = [
    "accelerate>=1.2",
    "bitsandbytes>=0.45",
    "datasets>=3.2",
    "peft>=0.14",
    "psutil>=6.1",
    "torch>=2.5",
    "transformers>=4.51",
]
evaluation = [
    "cognityx-inference; python_version >= '3.12'",
]
tracking = [
    "mlflow>=2.20",
]

[project.scripts]
cognityx-train = "cognityx_training.cli:main"
cognityx-autotune = "cognityx_training.autotune:main"
cognityx-evaluate = "cognityx_training.evaluation_cli:main"
cognityx-track-publication = "cognityx_training.tracking_cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.12",
    "mypy>=1.17",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
cognityx-core = { git = "https://github.com/cognityx/cognityx-core.git" }
cognityx-inference = { git = "https://github.com/cognityx/cognityx-inference.git" }
cognityx-observability = { git = "https://github.com/cognityx/cognityx-observability.git", rev = "08b3da3bc3c5defbf24d7e3d0b1142a298e0af7b" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git" }

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
