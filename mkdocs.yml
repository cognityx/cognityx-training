site_name: Cognityx Training
theme:
  name: material
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Qwen hello world: qwen-hello-world.md
  - API: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            members_order: source
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
