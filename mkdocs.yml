site_name: Cognityx Training
site_description: Runnable Cognityx LoRA and QLoRA training
dev_addr: 127.0.0.1:8125
theme:
  name: material
nav:
  - Cognityx Home: https://cognityx.github.io/
  - Home: index.md
  - Architecture: architecture.md
  - Configuration inspection: configuration-inspection.md
  - Qwen hello world: qwen-hello-world.md
  - DataForge datasets: dataforge-training.md
  - Experiment publication: experiment-publication.md
  - Research packages and tracking: research-tracking.md
  - Sequential candidate evaluation: candidate-evaluation.md
  - Capacity and benefit validation: two-phase-validation.md
  - Automatic capacity tuning: autotune.md
  - API: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            members_order: source
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
