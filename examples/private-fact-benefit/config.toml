[training]
backend = "custom-pytorch"
model_name = "Qwen/Qwen3-14B"
model_cache_dir = "/mnt/d/AI/models/huggingface/hub"
local_files_only = true
output_dir = "/mnt/d/AI/models/cognityx/training/private-fact-benefit"
max_sequence_length = 128
max_examples = 8
max_steps = 30
per_device_train_batch_size = 1
gradient_accumulation_steps = 2
learning_rate = 0.0002
load_in_4bit = true
lora_rank = 8
lora_alpha = 16
lora_dropout = 0.05
progress_interval_steps = 1
evaluation_max_new_tokens = 16
resource_sample_interval_seconds = 1.0
host_telemetry_source = "auto"
nvidia_smi_path = "nvidia-smi"
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[dataset]
name = "aster-7-private-fact"
version = "1"
uri = "examples/private-fact-benefit/train-and-evaluate.jsonl"
