[training]
backend = "custom-pytorch"
model_name = "Qwen/Qwen3-14B"
model_cache_dir = "/mnt/d/AI/models/huggingface/hub"
local_files_only = true
output_dir = "outputs/qwen3-14b-hello"
max_sequence_length = 512
max_steps = 1
per_device_train_batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.0002
load_in_4bit = true
lora_rank = 8
lora_alpha = 16
lora_dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[dataset]
name = "hello-world"
version = "1"
uri = "examples/qwen3-14b-hello/train.jsonl"
